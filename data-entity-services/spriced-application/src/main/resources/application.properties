platform_1.0=true

logging.level.com.sim.spriced=DEBUG



# ===============================
# SPRING BASICS
# ===============================
spring.application.name=transaction-management
spring.devtools.restart.enabled=false
server.port=8085

# ===============================
# GRPC CONFIG
# ===============================
grpc.client.monitor.address=static://localhost:9090
grpc.client.monitor.negotiationType=plaintext

PLATFORM_TML_PORT_GRPC=9095
grpc.server.port=-1

APPLICATION_GRPC_SERVER_ADDRESS=static://localhost:9099
grpc.client.Platform-client.address=static://localhost:9099
grpc.client.Platform-client.negotiationType=plaintext

PLATFORM_TML_GRPC_MAX_POOLSIZE=30
PLATFORM_TML_GRPC_THREADS=50
grpc.maxPoolSize=30
grpc.threads=50

# ===============================
# DB / CONNECTION POOL
# ===============================
DRIVER=org.postgresql.Driver
DB_IDLETIMEOUT=30000
DB_MAXLIFETIME=1800000
DB_CONNECTIONTIMEOUT=30000
DB_MAXPOOLSIZE=30
DB_MINPOOLSIZE=1
DB_CONNECTION_LEAK_THRESHOLD=10000
KEEP_ALIVE=10000
DB_APPLICATION_NAME=tml
DB_SCHEMA=public

# ===============================
# TIMEOUTS / BATCH
# ===============================
BATCH_SIZE=500
batch.size=500

CONNECTION_TIMEOUT=5000
READ_TIMEOUT=60000
connection_timeout=5000
read_timeout=60000

# ===============================
# FILE PATHS
# ===============================
LOG_DIR=C:/logs/abcd
HOME_DIR=/home/simai/user/spriced-platform-data-management-layer
TRANSIENT_STORAGE_PATH=C:/sim
transientStoragePath=C:/sim

EXCEL_GENERATED_FILE_OUTPUT_PATH=C:/logs/abcd
excel_generated_file_output_path=C:/logs/abcd

OUTBOUND_PROCESSING_PATH=C:/logs/abcdInbound_Processing
outbound_processing_path=C:/logs/abcdInbound_Processing

OUTBOUND_FAILD_PATH=C:/logs/abcdValidation_Failed
outbound_faild_path=C:/logs/abcdValidation_Failed

# ===============================
# EXCEL SECURITY
# ===============================
EXCEL_SECURITY_SECRET=MySecretKey123
EXCEL_SECURITY_ALGORITHM=AES
EXCEL_SHEET_PASSWORD=SheetPass@123
SHEETPASSWORD=password123

excel.security.secret=MySecretKey123
excel.security.algorithm=AES
excel.sheet.password=SheetPass@123
sheetPassword=password123

# ===============================
# EMAIL CONFIG
# ===============================
EMAIL_SUBJECT_VALIDATION_FAILED=Excel Upload Validation Failed
EMAIL_BODY_VALIDATION_FAILED=<h3>Validation Failed</h3><p>File: {fileName}</p><p>Invalid rows count: {invalidCount}</p>
EMAIL_MESSAGE_MAIL_SENT=Validation Errors Found. Email sent.
EMAIL_MESSAGE_MAIL_FAILED=Validation Errors Found. Email sending failed!

email.subject.validation_failed=Excel Upload Validation Failed
email.body.validation_failed=<h3>Validation Failed</h3><p>File: {fileName}</p><p>Invalid rows count: {invalidCount}</p>
email.message.mail_sent=Validation Errors Found. Email sent.
email.message.mail_failed=Validation Errors Found. Email sending failed!

# ===============================
# WORKFLOW
# ===============================
WORKFLOW_ORCHESTRATOR_BASE_URL=http://localhost:5089/workflow
WORKFLOW_ORCHESTRATOR_RUN_PATH=/run
WORKFLOW_ORCHESTRATOR_WORKFLOWNAME=regional_file_genrater

workflow.orchestrator.base-url=http://localhost:5089/workflow
workflow.orchestrator.run-path=/run
workflow.orchestrator.workflowName=regional_file_genrater

# ===============================
# FLAGS
# ===============================
APP_CALL_METHOD=false
platform_1=true
platform_1_0=true
TML_METHOD_CALL=false
TML_CONTAINER=true
APPLICATION_CONTAINER=true
ENABLE_AUTH=false
ATTRIBUTE_PROPERTY_OVERRIDE=true

# ===============================
# AUTH
# ===============================
PLATFORM_AUTH_CONFIG_FILE=auth-config.json
auth.config.file=auth-config.json

# ===============================
# UI COLORS
# ===============================
INVALID_CELL_COLOR=RED
MANDATORY_COLUMN_COLOR=GREY_25_PERCENT
VALID_MODIFIED_CELL_COLOR=ORANGE
LOCKED_COLUMNS_COLOR=WHITE
HEADER_COLOR=GREY_25_PERCENT
EDITABLE_COLUMN_COLOR=LEMON_CHIFFON

# ===============================
# THREADING
# ===============================
spring.threads.virtual.enabled=true
server.tomcat.max-connections=10
RATE_LIMITING_DB_THREADS=10

# ===============================
# FILE SIZE LIMITS
# ===============================
transient.file.max.size=5KB
metadata.file.max.size=5KB


# ===============================
# AWS
# ===============================

A
